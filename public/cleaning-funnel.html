<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pristine Co. | Luxury Cleaning Redefined</title>
    <meta name="description" content="Experience the art of clean. Luxury cleaning services that transform your space into a sanctuary of perfection.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Cormorant Garamond', 'serif'],
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        sage: {
                            50: '#f6f7f4',
                            100: '#e8ebe3',
                            200: '#d3d9c8',
                            300: '#b5c0a3',
                            400: '#96a57d',
                            500: '#7a8b60',
                            600: '#5f6e4a',
                            700: '#4b573c',
                            800: '#3e4733',
                            900: '#353d2d',
                        },
                        cream: {
                            50: '#fefdfb',
                            100: '#fdf9f3',
                            200: '#faf3e6',
                            300: '#f5e8d3',
                            400: '#edd8b8',
                            500: '#e4c799',
                        },
                        charcoal: {
                            50: '#f6f6f6',
                            100: '#e7e7e7',
                            800: '#2a2a2a',
                            900: '#1a1a1a',
                            950: '#0d0d0d',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out infinite 2s',
                        'reveal': 'reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 20s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(2deg)' },
                        },
                        reveal: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(60px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    }
                }
            }
        }
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Outfit', sans-serif; background: #fefdfb; color: #1a1a1a; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fdf9f3; }
        ::-webkit-scrollbar-thumb { background: #b5c0a3; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #96a57d; }
        
        /* Before/After Slider */
        .comparison-slider {
            position: relative;
            overflow: hidden;
            cursor: ew-resize;
        }
        .comparison-slider img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .comparison-slider .after-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
        }
        .comparison-slider .after-wrapper img {
            width: 200%;
            max-width: none;
        }
        .comparison-slider .slider-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: white;
            left: 50%;
            transform: translateX(-50%);
            cursor: ew-resize;
            z-index: 10;
        }
        .comparison-slider .slider-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 11;
        }
        
        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #5f6e4a 0%, #96a57d 50%, #7a8b60 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Organic shapes */
        .blob {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
        .blob-2 {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }
        
        /* Parallax */
        .parallax-slow { transform: translateY(calc(var(--scroll) * 0.1)); }
        .parallax-medium { transform: translateY(calc(var(--scroll) * 0.2)); }
        
        /* Noise texture overlay */
        .noise::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
        }
        
        /* Reveal animation on scroll */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Marquee */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .marquee-track {
            animation: marquee 30s linear infinite;
        }
        
        /* Split text */
        .split-line {
            overflow: hidden;
        }
        .split-line span {
            display: inline-block;
            transform: translateY(100%);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Beautiful placeholder images (Unsplash)
        const images = {
            hero: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1920&q=80',
            heroOverlay: 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1920&q=80',
            before1: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800&q=80',
            after1: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&q=80',
            before2: 'https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?w=800&q=80',
            after2: 'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=800&q=80',
            before3: 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800&q=80',
            after3: 'https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=800&q=80',
            team1: 'https://images.unsplash.com/photo-1594824476967-48c8b964273f?w=400&q=80',
            team2: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400&q=80',
            team3: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80',
            detail1: 'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=600&q=80',
            detail2: 'https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=600&q=80',
            detail3: 'https://images.unsplash.com/photo-1600573472592-401b489a3cdc?w=600&q=80',
            lifestyle1: 'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=800&q=80',
            lifestyle2: 'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=800&q=80',
        };

        // Before/After Comparison Slider Component
        const ComparisonSlider = ({ beforeImg, afterImg, label }) => {
            const containerRef = useRef(null);
            const [sliderPos, setSliderPos] = useState(50);
            const [isDragging, setIsDragging] = useState(false);

            const handleMove = (clientX) => {
                if (!containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
                const percent = (x / rect.width) * 100;
                setSliderPos(percent);
            };

            const handleMouseDown = () => setIsDragging(true);
            const handleMouseUp = () => setIsDragging(false);
            const handleMouseMove = (e) => isDragging && handleMove(e.clientX);
            const handleTouchMove = (e) => handleMove(e.touches[0].clientX);

            useEffect(() => {
                document.addEventListener('mouseup', handleMouseUp);
                document.addEventListener('mousemove', handleMouseMove);
                return () => {
                    document.removeEventListener('mouseup', handleMouseUp);
                    document.removeEventListener('mousemove', handleMouseMove);
                };
            });

            return (
                <div className="relative group">
                    {label && (
                        <div className="absolute top-4 left-4 z-20 glass px-4 py-2 rounded-full">
                            <span className="text-sm font-medium text-charcoal-800">{label}</span>
                        </div>
                    )}
                    <div
                        ref={containerRef}
                        className="comparison-slider aspect-[4/3] rounded-3xl overflow-hidden shadow-2xl"
                        onMouseDown={handleMouseDown}
                        onTouchMove={handleTouchMove}
                        onTouchStart={() => setIsDragging(true)}
                        onTouchEnd={() => setIsDragging(false)}
                    >
                        {/* Before Image (Background) */}
                        <img src={beforeImg} alt="Before" className="absolute inset-0 w-full h-full object-cover" />
                        
                        {/* After Image (Foreground with clip) */}
                        <div 
                            className="after-wrapper"
                            style={{ width: `${sliderPos}%` }}
                        >
                            <img 
                                src={afterImg} 
                                alt="After" 
                                style={{ width: `${100 / (sliderPos / 100)}%` }}
                            />
                        </div>
                        
                        {/* Slider Handle */}
                        <div 
                            className="slider-handle"
                            style={{ left: `${sliderPos}%` }}
                        >
                            <div className="slider-button shadow-xl group-hover:scale-110 transition-transform">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5f6e4a" strokeWidth="2">
                                    <path d="M18 8L22 12L18 16" />
                                    <path d="M6 8L2 12L6 16" />
                                </svg>
                            </div>
                        </div>
                        
                        {/* Labels */}
                        <div className="absolute bottom-4 left-4 glass px-3 py-1.5 rounded-full">
                            <span className="text-xs font-medium uppercase tracking-wider text-charcoal-800">Before</span>
                        </div>
                        <div className="absolute bottom-4 right-4 glass px-3 py-1.5 rounded-full">
                            <span className="text-xs font-medium uppercase tracking-wider text-charcoal-800">After</span>
                        </div>
                    </div>
                </div>
            );
        };

        // Navbar
        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            const [menuOpen, setMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${scrolled ? 'glass py-4 shadow-lg' : 'py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
                        <a href="#" className="flex items-center gap-3 group">
                            <div className="w-12 h-12 bg-sage-500 rounded-2xl flex items-center justify-center rotate-6 group-hover:rotate-0 transition-transform duration-500">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                    <path d="M2 17l10 5 10-5"/>
                                    <path d="M2 12l10 5 10-5"/>
                                </svg>
                            </div>
                            <div>
                                <span className="font-display text-2xl font-semibold tracking-tight">Pristine</span>
                                <span className="text-sage-500 font-display text-2xl">.</span>
                            </div>
                        </a>
                        
                        <div className="hidden md:flex items-center gap-10">
                            {['Process', 'Transformations', 'Pricing', 'Stories'].map((item) => (
                                <a 
                                    key={item} 
                                    href={`#${item.toLowerCase()}`} 
                                    className="text-sm font-medium text-charcoal-800/70 hover:text-charcoal-900 transition-colors relative group"
                                >
                                    {item}
                                    <span className="absolute -bottom-1 left-0 w-0 h-0.5 bg-sage-500 group-hover:w-full transition-all duration-300"></span>
                                </a>
                            ))}
                        </div>
                        
                        <button className="hidden md:flex items-center gap-2 bg-charcoal-900 text-white px-6 py-3 rounded-full hover:bg-charcoal-800 transition-colors group">
                            <span className="text-sm font-medium">Book Now</span>
                            <svg className="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                            </svg>
                        </button>
                        
                        <button className="md:hidden p-2" onClick={() => setMenuOpen(!menuOpen)}>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                {menuOpen ? <path d="M18 6L6 18M6 6l12 12"/> : <path d="M4 8h16M4 16h16"/>}
                            </svg>
                        </button>
                    </div>
                    
                    {/* Mobile Menu */}
                    {menuOpen && (
                        <div className="md:hidden absolute top-full left-0 right-0 glass p-6 border-t border-white/20">
                            <div className="flex flex-col gap-4">
                                {['Process', 'Transformations', 'Pricing', 'Stories'].map((item) => (
                                    <a key={item} href={`#${item.toLowerCase()}`} className="text-lg font-medium py-2" onClick={() => setMenuOpen(false)}>
                                        {item}
                                    </a>
                                ))}
                                <button className="mt-4 bg-charcoal-900 text-white px-6 py-3 rounded-full">
                                    Book Now
                                </button>
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        // Hero Section - Cinematic
        const HeroSection = () => {
            const [loaded, setLoaded] = useState(false);
            
            useEffect(() => {
                setTimeout(() => setLoaded(true), 100);
            }, []);

            return (
                <section className="relative min-h-screen flex items-center overflow-hidden noise">
                    {/* Background Image with Parallax */}
                    <div className="absolute inset-0">
                        <img 
                            src={images.hero} 
                            alt="Luxury Interior" 
                            className="w-full h-full object-cover scale-110"
                            style={{ transform: 'scale(1.1)' }}
                        />
                        <div className="absolute inset-0 bg-gradient-to-r from-cream-50/95 via-cream-50/80 to-transparent"></div>
                        <div className="absolute inset-0 bg-gradient-to-t from-cream-50/50 via-transparent to-cream-50/30"></div>
                    </div>
                    
                    {/* Floating Elements */}
                    <div className="absolute top-20 right-20 w-64 h-64 bg-sage-200/30 blob animate-float hidden lg:block"></div>
                    <div className="absolute bottom-32 right-1/4 w-40 h-40 bg-sage-300/20 blob-2 animate-float-delayed hidden lg:block"></div>
                    
                    {/* Content */}
                    <div className="relative z-10 max-w-7xl mx-auto px-6 py-32 lg:py-0">
                        <div className="max-w-2xl">
                            {/* Badge */}
                            <div className={`inline-flex items-center gap-3 bg-white/80 backdrop-blur-sm rounded-full pl-2 pr-5 py-2 mb-8 shadow-lg transition-all duration-1000 ${loaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}>
                                <span className="bg-sage-500 text-white text-xs font-semibold px-3 py-1 rounded-full">NEW</span>
                                <span className="text-sm text-charcoal-800">Eco-Luxury Cleaning Experience</span>
                            </div>
                            
                            {/* Headline */}
                            <h1 className={`font-display text-5xl md:text-7xl lg:text-8xl font-semibold leading-[0.9] mb-8 transition-all duration-1000 delay-200 ${loaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'}`}>
                                <span className="block">The Art of</span>
                                <span className="gradient-text">Pristine</span>
                                <span className="block">Living</span>
                            </h1>
                            
                            {/* Subheadline */}
                            <p className={`text-lg md:text-xl text-charcoal-800/70 leading-relaxed mb-10 max-w-lg transition-all duration-1000 delay-300 ${loaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'}`}>
                                Where meticulous craftsmanship meets environmental consciousness. 
                                Transform your space into a sanctuary of serenity.
                            </p>
                            
                            {/* CTA Buttons */}
                            <div className={`flex flex-col sm:flex-row gap-4 transition-all duration-1000 delay-500 ${loaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'}`}>
                                <button className="group flex items-center justify-center gap-3 bg-charcoal-900 text-white px-8 py-4 rounded-full hover:bg-charcoal-800 transition-all hover:shadow-2xl hover:shadow-charcoal-900/20">
                                    <span className="font-medium">Experience the Difference</span>
                                    <svg className="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                                    </svg>
                                </button>
                                <button className="flex items-center justify-center gap-3 bg-white/50 backdrop-blur-sm border border-charcoal-200 px-8 py-4 rounded-full hover:bg-white transition-all">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    <span className="font-medium">Watch Our Story</span>
                                </button>
                            </div>
                            
                            {/* Stats */}
                            <div className={`flex gap-12 mt-16 transition-all duration-1000 delay-700 ${loaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'}`}>
                                {[
                                    { number: '15K+', label: 'Homes Transformed' },
                                    { number: '99%', label: 'Client Retention' },
                                    { number: '5★', label: 'Avg. Rating' },
                                ].map((stat, i) => (
                                    <div key={i} className="text-center sm:text-left">
                                        <p className="font-display text-3xl md:text-4xl font-semibold text-charcoal-900">{stat.number}</p>
                                        <p className="text-sm text-charcoal-600 mt-1">{stat.label}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    {/* Scroll Indicator */}
                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-60">
                        <span className="text-xs uppercase tracking-widest">Scroll</span>
                        <div className="w-6 h-10 border-2 border-charcoal-400 rounded-full flex justify-center pt-2">
                            <div className="w-1.5 h-3 bg-charcoal-400 rounded-full animate-bounce"></div>
                        </div>
                    </div>
                </section>
            );
        };

        // Marquee Section
        const MarqueeSection = () => {
            const items = ['Eco-Friendly', '★', 'Luxury Service', '★', 'Trusted by 15,000+', '★', 'Same-Day Available', '★', '100% Satisfaction', '★'];
            
            return (
                <div className="bg-sage-500 py-4 overflow-hidden">
                    <div className="marquee-track flex gap-8 whitespace-nowrap">
                        {[...items, ...items].map((item, i) => (
                            <span key={i} className="text-white font-medium text-lg">{item}</span>
                        ))}
                    </div>
                </div>
            );
        };

        // Transformations Section with Before/After Sliders
        const TransformationsSection = () => {
            return (
                <section id="transformations" className="py-24 md:py-32 bg-cream-100/50 relative overflow-hidden noise">
                    {/* Background decoration */}
                    <div className="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-sage-100/50 to-transparent pointer-events-none"></div>
                    
                    <div className="max-w-7xl mx-auto px-6 relative z-10">
                        {/* Section Header */}
                        <div className="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-16">
                            <div>
                                <span className="text-sage-600 text-sm uppercase tracking-widest font-medium">Transformations</span>
                                <h2 className="font-display text-4xl md:text-6xl font-semibold mt-4 leading-tight">
                                    See the Magic<br/>
                                    <span className="gradient-text">Unfold</span>
                                </h2>
                            </div>
                            <p className="text-charcoal-600 max-w-md text-lg leading-relaxed">
                                Slide to reveal the stunning before and after of our meticulous cleaning process. 
                                Every corner, every surface, transformed.
                            </p>
                        </div>
                        
                        {/* Before/After Sliders Grid */}
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                            <div className="reveal-on-scroll">
                                <ComparisonSlider 
                                    beforeImg={images.before1} 
                                    afterImg={images.after1}
                                    label="Living Room"
                                />
                            </div>
                            <div className="reveal-on-scroll" style={{ transitionDelay: '0.1s' }}>
                                <ComparisonSlider 
                                    beforeImg={images.before2} 
                                    afterImg={images.after2}
                                    label="Kitchen"
                                />
                            </div>
                            <div className="reveal-on-scroll md:col-span-2 lg:col-span-1" style={{ transitionDelay: '0.2s' }}>
                                <ComparisonSlider 
                                    beforeImg={images.before3} 
                                    afterImg={images.after3}
                                    label="Bathroom"
                                />
                            </div>
